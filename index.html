<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老罗 · 生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1040 30%, #2a1a50 60%, #0a0a1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 星空 */
  .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay); opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.12; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.5); }
  }

  /* 飘落粒子 */
  .particle {
    position: fixed; pointer-events: none; z-index: 2;
    animation: fall linear infinite;
    text-shadow: 0 0 6px currentColor;
  }
  @keyframes fall {
    from { transform: translateY(-10vh) rotate(0deg); opacity: 0.85; }
    to   { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .main-container {
    position: relative; z-index: 1; width: 100%; max-width: 660px;
    padding: 28px 20px 50px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ===== 祝福卡片 ===== */
  .card {
    width: 100%;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 30px 28px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 80px rgba(120,80,200,0.12);
    text-align: center;
    animation: floatIn 0.8s ease-out;
    margin-bottom: 24px;
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-accent {
    width: 50px; height: 3px;
    background: linear-gradient(90deg, #c084fc, #f472b6, #fb923c);
    border-radius: 2px; margin: 0 auto 18px;
  }

  .main-title {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #f472b6, #c084fc, #60a5fa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 6px;
  }

  .blessing {
    font-size: 13px; color: rgba(255,255,255,0.75);
    line-height: 1.8; margin: 12px 0;
  }
  .blessing .highlight {
    display: inline-block; padding: 1px 6px;
    background: rgba(244,114,182,0.15); border-radius: 4px; color: #f9a8d4;
  }

  .from { margin-top: 16px; font-size: 14px; color: rgba(255,255,255,0.6); }
  .from-name { font-size: 18px; font-weight: 600; color: #fbbf24; margin-top: 2px; }

  .music-tag {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; background: rgba(255,255,255,0.06);
    border-radius: 18px; font-size: 11px; color: rgba(255,255,255,0.45);
  }
  .music-dot { width: 4px; height: 4px; border-radius: 50%; }
  .music-dot:nth-child(1) { background: #f472b6; animation: musicPulse 1.2s ease-in-out infinite; }
  .music-dot:nth-child(2) { background: #c084fc; animation: musicPulse 1.2s ease-in-out infinite 0.2s; }
  .music-dot:nth-child(3) { background: #60a5fa; animation: musicPulse 1.2s ease-in-out infinite 0.4s; }
  @keyframes musicPulse {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1.8); }
  }

  /* ===== 图片排版区标题 ===== */
  .section-label {
    font-size: 13px; color: rgba(255,255,255,0.4);
    letter-spacing: 4px; margin-bottom: 14px;
  }

  /* ===== 图片排版容器 ===== */
  .layout-container {
    position: relative; width: 620px; height: 430px;
  }

  /* 装饰背景网格线 */
  .grid-lines {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0; transition: opacity 2s;
  }
  .grid-lines.visible { opacity: 0.12; }

  /* 单张图片卡片 */
  .photo-item {
    position: absolute; border-radius: 10px; overflow: visible;
    transition: left 1.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                top 1.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                width 1.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 1.8s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 1.5s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    will-change: left, top, width, height;
    z-index: 1;
    /* 默认网格大小 */
    width: 193px; height: 193px;
  }

  /* 光晕底层 */
  .photo-glow {
    position: absolute; inset: -4px; border-radius: 14px;
    background: linear-gradient(135deg, #c084fc, #f472b6, #60a5fa);
    background-size: 200% 200%;
    opacity: 0; z-index: -1;
    filter: blur(10px);
    transition: opacity 2s ease;
  }

  /* 图片内层（用于呼吸动画） */
  .photo-inner {
    width: 100%; height: 100%; border-radius: 10px; overflow: hidden;
    position: relative; z-index: 1;
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-radius 1.5s ease;
    animation: none;
  }
  .photo-inner.breathing {
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.025); }
    70% { transform: scale(0.985); }
  }

  .photo-inner img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: filter 1.5s;
  }

  /* 序号标签 */
  .photo-number {
    position: absolute; bottom: 6px; right: 8px; z-index: 2;
    font-size: 10px; color: rgba(255,255,255,0.45);
    background: rgba(0,0,0,0.35); padding: 2px 8px;
    border-radius: 8px; letter-spacing: 0.5px;
    transition: opacity 0.6s;
  }

  /* ===== 底部留白装饰 ===== */
  .bottom-decoration {
    margin-top: 30px; width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(192,132,252,0.4), transparent);
    border-radius: 1px;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div id="particles"></div>

<div class="main-container">

  <!-- 祝福卡片 -->
  <div class="card">
    <div class="top-accent"></div>
    <div class="main-title">老罗 · 生日快乐</div>
    <div class="blessing">
      很高兴能以这样的方式，送上我的祝福。<br>
      一路走来，有幸成为彼此<span class="highlight">最好的朋友</span>。<br>
      老罗，生日快乐！<br>
      <span class="highlight">快乐翻倍</span>，<span class="highlight">烦恼减半</span>！
    </div>
    <div class="from">
      你的好朋友<br>
      <div class="from-name">老黄</div>
    </div>
    <div class="music-tag">
      <span class="music-dot"></span><span class="music-dot"></span><span class="music-dot"></span>
      陆虎《像你这样的朋友》
    </div>
  </div>

  <div class="section-label">精 彩 瞬 间</div>

  <!-- 图片排版区 -->
  <div class="layout-container" id="layoutContainer">
    <!-- JS 动态生成 6 张卡片 -->
  </div>

  <div class="bottom-decoration"></div>

</div>

<script>
// ===== 星空 =====
(function() {
  const c = document.getElementById('stars'), f = document.createDocumentFragment();
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random() * 2.5 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*3+2}s;--delay:${Math.random()*3}s`;
    f.appendChild(s);
  }
  c.appendChild(f);
})();

// ===== 粒子 =====
(function() {
  const c = document.getElementById('particles'), f = document.createDocumentFragment();
  const shapes = ['✦','♡','◆','★','◈','❋','✧','❖'];
  const colors = ['#c084fc','#f472b6','#60a5fa','#fbbf24','#a78bfa','#f9a8d4','#818cf8','#67e8f9'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    p.textContent = shapes[Math.floor(Math.random()*shapes.length)];
    p.style.cssText = `left:${Math.random()*100}%;color:${colors[Math.floor(Math.random()*colors.length)]};font-size:${Math.random()*14+8}px;animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*7}s`;
    f.appendChild(p);
  }
  c.appendChild(f);
})();

// ===== 图片排版动画 =====
(function() {
  const container = document.getElementById('layoutContainer');
  const images = ['img_01.png','img_02.png','img_03.png','img_04.png','img_05.png','img_06.png'];

  // 预加载
  images.forEach(src => { const img = new Image(); img.src = src; });

  // 创建 6 张卡片
  const items = images.map((src, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.id = 'photo-' + i;

    const glow = document.createElement('div');
    glow.className = 'photo-glow';

    const inner = document.createElement('div');
    inner.className = 'photo-inner';

    const img = document.createElement('img');
    img.src = src;
    img.alt = '图片 ' + (i + 1);

    const num = document.createElement('div');
    num.className = 'photo-number';
    num.textContent = (i + 1) + '/6';

    inner.appendChild(img);
    item.appendChild(glow);
    item.appendChild(inner);
    item.appendChild(num);
    container.appendChild(item);

    return { item, glow, inner };
  });

  // ===== 坐标定义 =====
  // 网格坐标（2×3），图片 193×193，间距 15px
  const gridPositions = [
    { left: 5,  top: 0,   w: 193, h: 193 },  // 图1
    { left: 213, top: 0,   w: 193, h: 193 },  // 图2
    { left: 421, top: 0,   w: 193, h: 193 },  // 图3
    { left: 5,  top: 208, w: 193, h: 193 },  // 图4
    { left: 213, top: 208, w: 193, h: 193 },  // 图5
    { left: 421, top: 208, w: 193, h: 193 },  // 图6
  ];

  // 散落初始坐标（从四面八方，保持网格大小）
  const scatterPositions = [
    { left: -210, top: -200, w: 193, h: 193 },
    { left: 680,  top: -170, w: 193, h: 193 },
    { left: -260, top: 480,  w: 193, h: 193 },
    { left: 650,  top: 500,  w: 193, h: 193 },
    { left: 150,  top: -340, w: 193, h: 193 },
    { left: 480,  top: 620,  w: 193, h: 193 },
  ];

  // 错落排列坐标（不规则，大小不一）
  const staggerPositions = [
    { left: 2,   top: -8,  w: 218, h: 218 },  // 图1 最大，左上
    { left: 235, top: 12,  w: 162, h: 162 },  // 图2 小，右上偏中
    { left: 412, top: -2,  w: 188, h: 188 },  // 图3 中，右上
    { left: 6,   top: 235, w: 195, h: 195 },  // 图4 中，左下
    { left: 218, top: 228, w: 168, h: 168 },  // 图5 小，中下
    { left: 402, top: 238, w: 202, h: 202 },  // 图6 中，右下
  ];

  // 错位时的 z-index（大图在上）
  const staggerZIndex = [5, 2, 3, 4, 1, 3];

  // 辅助函数：应用位置（无过渡）
  function setPosition(item, pos) {
    item.style.transition = 'none';
    item.style.left = pos.left + 'px';
    item.style.top = pos.top + 'px';
    item.style.width = pos.w + 'px';
    item.style.height = pos.h + 'px';
  }

  // 辅助函数：过渡到目标位置
  function transitionTo(item, pos, duration, easing) {
    const e = easing || 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    item.style.transition = `left ${duration}s ${e}, top ${duration}s ${e}, width ${duration}s ${e}, height ${duration}s ${e}, box-shadow 1.5s ease`;
    item.style.left = pos.left + 'px';
    item.style.top = pos.top + 'px';
    item.style.width = pos.w + 'px';
    item.style.height = pos.h + 'px';
  }

  // ===== 初始化：设置散落位置 =====
  items.forEach((obj, i) => {
    setPosition(obj.item, scatterPositions[i]);
  });

  // 强制回流
  container.offsetHeight;

  // ===== 阶段 1：散落 → 聚合（1s 延迟，2s 过渡）=====
  setTimeout(() => {
    items.forEach((obj, i) => {
      transitionTo(obj.item, gridPositions[i], 1.8);
    });

    // 聚合后：开启呼吸动画 + 微弱光晕
    setTimeout(() => {
      items.forEach((obj, i) => {
        obj.inner.classList.add('breathing');
        obj.inner.style.animationDelay = (i * 0.6) + 's';
        obj.glow.style.opacity = '0.25';
      });
    }, 1900);

  }, 1000);

  // ===== 阶段 2 → 阶段 3：网格 → 错落（约 19s 时，过渡 2.5s）=====
  setTimeout(() => {
    // 先关闭呼吸动画
    items.forEach(obj => {
      obj.inner.classList.remove('breathing');
      obj.inner.style.animationDelay = '0s';
    });

    // 过渡到错落位置
    items.forEach((obj, i) => {
      transitionTo(obj.item, staggerPositions[i], 2.5, 'cubic-bezier(0.25, 0.1, 0.25, 1)');
      obj.item.style.zIndex = staggerZIndex[i];
      // 光晕增强
      obj.glow.style.opacity = (i === 0 || i === 5) ? '0.5' : '0.35';
      // 大图加强阴影
      const isBig = staggerPositions[i].w >= 210;
      obj.item.style.boxShadow = isBig
        ? '0 8px 32px rgba(0,0,0,0.4), 0 0 40px rgba(192,132,252,0.2)'
        : '0 4px 20px rgba(0,0,0,0.35), 0 0 20px rgba(244,114,182,0.1)';
    });

  }, 19000);

})();
</script>

</body>
</html>
